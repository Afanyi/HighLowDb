name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Application and deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: false
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: false
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run application and deployment checks
        continue-on-error: false
        run: bash tests/check_ci.sh
