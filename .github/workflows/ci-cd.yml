name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Application and deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: false
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: false
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run application and deployment checks
        continue-on-error: false
        run: bash tests/check_ci.sh

  deploy:
    name: Deploy production
    needs: [verify]
    if: >-
      ${{ github.ref == 'refs/heads/main' && needs.verify.result == 'success' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && vars.ENABLE_AUTO_DEPLOY == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: false
    environment: production
    concurrency:
      group: allstocks-production
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the verified event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: false
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Deploy through the existing updater
        continue-on-error: false
        env:
          CI_VERIFY_RESULT: ${{ needs.verify.result }}
          ENABLE_AUTO_DEPLOY: ${{ vars.ENABLE_AUTO_DEPLOY }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: python3 deploy/ci.py
