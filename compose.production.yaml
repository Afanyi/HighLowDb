# Merge after compose.yaml. Requires Docker Compose >= 2.24 for !reset.
# Use the same project/volume identity for every staged release.
name: allstocks-database
services:
  app:
    image: allstocks-database:${APP_RELEASE:?Set APP_RELEASE to the reviewed release identity}
    environment:
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:?Set APP_PUBLIC_ORIGIN to the HTTPS origin}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set a private random APP_SECRET_KEY}
    # Caddy reaches the private upstream on the inspected existing network.
    ports: !reset []
    networks:
      ingress:
        aliases: [allstocks-database-app]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  ingress:
    external: true
    name: trading-assistant_default

volumes:
  data:
    name: allstocks-database_data
